<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>LINE OA 管理平台</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="panel-header"><div class="brand"><span class="brand-mark">L</span><div><strong>LINE OA 管理平台</strong><small>Quick Control</small></div></div><div class="header-actions"><button id="maximize-console" class="icon-button" type="button" aria-label="開啟完整後台" title="開啟完整後台">⛶</button><button id="refresh-health" class="icon-button" type="button" aria-label="更新平台狀態">↻</button></div></header>
<main>
<section class="oa-control"><label for="current-oa">目前 OA</label><select id="current-oa" data-current-oa-select aria-label="目前官方帳號"></select><div class="connection-line"><span class="status-dot"></span><strong>已連線</strong><small>Sandbox Live</small></div></section>
<section class="compact-section" aria-labelledby="status-title"><div class="section-heading"><h1 id="status-title">狀態</h1><span id="context-badge">Other page</span></div><p id="context-detail" class="context-detail">Open LINE OA Manager or LINE Chat to see bounded page context.</p><dl class="status-list"><div><dt>平台連線</dt><dd data-health-state>Online</dd></div><div><dt>Webhook 驗證</dt><dd class="good">已通過</dd></div><div><dt>目前 Binding</dt><dd data-current-oa>oa-primary</dd></div></dl><p id="health-note" class="health-note">Last verified locally</p></section>
<section class="compact-section" aria-labelledby="activity-title"><div class="section-heading"><h2 id="activity-title">最新訊息活動</h2><button type="button" data-admin-launch="messages">全部</button></div><div id="latest-activity" class="activity-list"></div></section>
<section class="compact-section" aria-labelledby="actions-title"><div class="section-heading"><h2 id="actions-title">快速操作</h2></div><div id="quick-admin-actions" class="quick-actions"></div></section>
</main>
<footer class="panel-footer"><button id="open-full-dashboard" class="primary-action" type="button">開啟完整後台</button><button id="return-line" class="secondary-action" type="button" disabled>返回 LINE OA</button></footer>
<script type="module" src="app.js"></script>
</body></html>
